services:
  - type: web
    name: centralizador-solucoes-diagnosticos
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: centralizador-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: DATABASE_PATH
        value: /var/data/centralizador.db
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: FALLBACK_LLM_PROVIDER
        value: gemini
      - key: FALLBACK_GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: MAX_OUTPUT_TOKENS
        value: "900"
      - key: LLM_TIMEOUT_SECONDS
        value: "120"
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: FALLBACK_LLM_API_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
